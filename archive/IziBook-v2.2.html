<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RSVP Reader</title>
<meta name="theme-color" content="#1a1a1a">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a1a; color: #e8e8e8; min-height: 100vh;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  
  /* Экран загрузки */
  #loader { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 40px; position: relative; }
  #loader h1 { font-size: 28px; font-weight: 600; }
  #loader p { color: #999; max-width: 500px; text-align: center; line-height: 1.5; }
  
  /* Хитрый инпут, который всегда работает */
  .file-btn-wrap { position: relative; display: inline-block; }
  .file-label { display: inline-block; padding: 14px 28px; background: #3a7bd5; color: white; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 16px; }
  .file-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  
  #pasteArea { width: 100%; max-width: 600px; height: 120px; padding: 12px; background: #262626; border: 1px solid #333; border-radius: 8px; color: #e8e8e8; font-family: inherit; resize: vertical; }
  .divider { color: #555; font-size: 13px; }
  #status { font-size: 14px; color: #f0a030; min-height: 20px; text-align: center; max-width: 600px; font-weight: 500; }
  #status.error { color: #ff6b6b; }
  
  /* Экран чтения */
  #reader { flex: 1; display: none; flex-direction: column; height: 100dvh; }
  #reader.active { display: flex; } /* Исправленный баг CSS */
  
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; position: relative; cursor: pointer; user-select: none; min-height: 0; }
  #word { font-size: clamp(28px, 6vw, 72px); font-weight: 500; text-align: center; line-height: 1.3; max-width: 90%; white-space: pre-wrap; word-break: break-word; }
  #focusLine { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 2px; height: 1.6em; background: rgba(255,80,80,0.35); pointer-events: none; }
  
  #progressBar { height: 4px; background: #333; }
  #progressFill { height: 100%; background: #3a7bd5; width: 0%; transition: width 0.1s linear; }
  
  #controls { padding: 16px 20px; background: #222; border-top: 1px solid #333; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: center; }
  .ctrl-group { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #aaa; }
  .ctrl-group input[type="range"] { width: 100px; accent-color: #3a7bd5; }
  .val { min-width: 40px; text-align: center; color: #e8e8e8; font-variant-numeric: tabular-nums; font-weight: 500; }
  button { padding: 10px 20px; background: #3a7bd5; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; }
  button.secondary { background: #444; }
  
  #wordCounter { position: absolute; bottom: 12px; right: 20px; font-size: 12px; color: #666; font-variant-numeric: tabular-nums; }
  #hint { position: absolute; bottom: 12px; left: 20px; font-size: 12px; color: #666; }
  
  @media (max-width: 600px) { 
    #controls { padding: 10px; gap: 10px; } 
    .ctrl-group input[type="range"] { width: 70px; } 
    #stage { padding: 16px; } 
    #hint { display: none; } 
  }
</style>
</head>
<body>

<div id="loader">
  <h1>📖 RSVP Reader</h1>
  <p>Загрузите <strong>.txt</strong> или <strong>.epub</strong>, либо вставьте текст. Читайте слово за словом без движения глаз.</p>
  
  <div class="file-btn-wrap">
    <div class="file-label">📁 Выбрать файл</div>
    <input type="file" id="fileInput" class="file-input" accept=".txt,.epub,text/plain,application/epub+zip">
  </div>
  
  <span class="divider">— или —</span>
  <textarea id="pasteArea" placeholder="Вставьте текст сюда..."></textarea>
  <div id="status"></div>
  <button id="startBtn">Начать чтение текста →</button>
</div>

<div id="reader">
  <div id="stage">
    <div id="focusLine"></div>
    <div id="word">Готовы?</div>
    <div id="hint">Пробел — пауза · ← → — назад/вперёд</div>
    <div id="wordCounter">0 / 0</div>
  </div>
  <div id="progressBar"><div id="progressFill"></div></div>
  <div id="controls">
    <button id="playBtn">▶ Старт</button>
    <button id="resetBtn" class="secondary">⟲ Сброс</button>
    <button id="backBtn" class="secondary">← К загрузке</button>
    <div class="ctrl-group"><label>Слов:</label><input type="range" id="wordsPerStep" min="1" max="20" value="1"><span class="val" id="wordsPerStepVal">1</span></div>
    <div class="ctrl-group"><label>Скорость:</label><input type="range" id="speed" min="100" max="1200" step="25" value="300"><span class="val" id="speedVal">300</span></div>
    <div class="ctrl-group"><label>Авто:</label><input type="checkbox" id="autoGroup"></div>
  </div>
</div>

<!-- JSZip для распаковки EPUB -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const loader = $('loader'), reader = $('reader'), wordEl = $('word'), stage = $('stage');
  const progressFill = $('progressFill'), wordCounter = $('wordCounter'), fileInput = $('fileInput');
  const pasteArea = $('pasteArea'), startBtn = $('startBtn'), playBtn = $('playBtn'), resetBtn = $('resetBtn');
  const backBtn = $('backBtn'), speedSlider = $('speed'), speedVal = $('speedVal'), 
        wpsSlider = $('wordsPerStep'), wpsVal = $('wordsPerStepVal'), autoGroup = $('autoGroup'), statusEl = $('status');

  let words = [], index = 0, playing = false, timer = null;

  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('error', !!isError);
  }

  // ---------- Безопасный манифест PWA (без ошибок в консоли) ----------
  try {
    const svgData = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="#3a7bd5" width="100" height="100" rx="20"/><text x="50" y="68" font-size="50" text-anchor="middle" fill="white">📖</text></svg>');
    const manifest = {
      name: "RSVP Reader", short_name: "RSVP", display: "standalone",
      background_color: "#1a1a1a", theme_color: "#1a1a1a",
      icons: [{ src: svgData, sizes: "any", type: "image/svg+xml", purpose: "any" }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const link = document.createElement('link'); 
    link.rel = 'manifest';
    link.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(link);
  } catch (e) { console.warn('manifest:', e); }

  // ---------- Извлечение текста из EPUB ----------
  async function extractEpubText(file) {
    if (typeof JSZip === 'undefined') throw new Error('JSZip не загружен (проверьте интернет)');
    
    // Читаем как ArrayBuffer, чтобы не зависеть от версии JSZip
    const arrayBuffer = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(arrayBuffer);

    // Ищем container.xml без учета регистра
    let containerPath = Object.keys(zip.files).find(p => p.toLowerCase() === 'meta-inf/container.xml');
    if (!containerPath) throw new Error('Это не EPUB: нет META-INF/container.xml');
    
    const containerXml = await zip.file(containerPath).async('string');
    const opfPathMatch = containerXml.match(/full-path=["']([^"']+)["']/);
    if (!opfPathMatch) throw new Error('Не найден файл OPF внутри EPUB');
    
    const opfPath = opfPathMatch[1];
    const opfDir = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
    const opfFile = zip.file(opfPath) || zip.file(opfPath.toLowerCase());
    if (!opfFile) throw new Error('Файл OPF не найден в архиве');

    const opfXml = await opfFile.async('string');
    
    // Парсим ID и пути к главам
    const manifestItems = {};
    const itemRegex = /<item\b[^>]*\bhref=["']([^"']+)["'][^>]*\bid=["']([^"']+)["'][^>]*>/g;
    let match;
    while ((match = itemRegex.exec(opfXml))) manifestItems[match[2]] = match[1];
    // Другой порядок атрибутов
    const itemRegex2 = /<item\b[^>]*\bid=["']([^"']+)["'][^>]*\bhref=["']([^"']+)["'][^>]*>/g;
    while ((match = itemRegex2.exec(opfXml))) manifestItems[match[1]] = match[2];

    // Порядок чтения из Spine
    const spineRegex = /<itemref\b[^>]*\bidref=["']([^"']+)["']/g;
    const order = [];
    while ((match = spineRegex.exec(opfXml))) order.push(match[1]);
    const ids = order.length ? order : Object.keys(manifestItems);

    let fullText = '';
    for (const id of ids) {
      const href = manifestItems[id];
      if (!href) continue;
      
      const cleanHref = decodeURIComponent(href.split('#')[0]); // убираем якоря
      const path = opfDir + cleanHref;
      const fileEntry = zip.file(path) || zip.file(path.toLowerCase());
      
      if (!fileEntry) continue;
      
      let html = await fileEntry.async('string');
      // Удаляем скрипты, стили и вытаскиваем текст
      html = html.replace(/<script[\s\S]*?<\/script>/gi, ' ')
                 .replace(/<style[\s\S]*?<\/style>/gi, ' ')
                 .replace(/<\/(p|div|h[1-6]|li|br)>/gi, '\n')
                 .replace(/<[^>]+>/g, ' ');
      
      const txt = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html').body.textContent;
      if (txt && txt.trim()) fullText += txt + '\n\n';
    }

    if (!fullText.trim()) throw new Error('В EPUB нет читаемого текста (возможно, DRM)');
    return fullText;
  }

  // ---------- Обработчики ----------
  fileInput.addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    setStatus('Обработка файла...');
    try {
      let text;
      if (file.name.toLowerCase().endsWith('.epub') || file.type === 'application/epub+zip') {
        text = await extractEpubText(file);
      } else {
        text = await file.text();
      }
      setStatus('');
      startReading(text);
    } catch (err) {
      console.error(err);
      setStatus('Ошибка: ' + err.message, true);
    }
    fileInput.value = ''; // сброс, чтобы можно было выбрать тот же файл
  });

  startBtn.addEventListener('click', () => {
    const text = pasteArea.value.trim();
    if (!text) { setStatus('Вставьте текст или выберите файл!', true); return; }
    setStatus('');
    startReading(text);
  });

  function startReading(text) {
    const cleanText = text.replace(/\r/g, '').replace(/[ \t]+/g, ' ');
    words = cleanText.split(/\s+/).filter(w => w.length > 0);
    
    if (!words.length) { setStatus('Не удалось найти слова в тексте', true); return; }
    
    index = 0;
    loader.style.display = 'none';
    reader.classList.add('active');
    render();
  }

  backBtn.addEventListener('click', () => {
    stop();
    reader.classList.remove('active');
    loader.style.display = 'flex';
  });

  // ---------- Логика RSVP ----------
  function getStepSize() {
    if (autoGroup.checked) {
      const w = words[index] || '';
      const len = w.replace(/[^\p{L}\p{N}]/gu, '').length;
      if (len > 9) return 1;
      if (len > 6) return 2;
      return 3;
    }
    return parseInt(wpsSlider.value, 10);
  }

  function render() {
    if (index >= words.length) {
      wordEl.textContent = '✓ Конец';
      progressFill.style.width = '100%';
      wordCounter.textContent = `${words.length} / ${words.length}`;
      stop(); return;
    }
    const step = getStepSize();
    wordEl.textContent = words.slice(index, index + step).join(' ');
    const done = Math.min(index + step, words.length);
    wordCounter.textContent = `${done} / ${words.length}`;
    progressFill.style.width = (done / words.length * 100) + '%';
  }

  function scheduleNext() {
    if (!playing) return;
    const step = getStepSize(), spm = parseInt(speedSlider.value, 10);
    let delay = (step / spm) * 60000;
    
    // Пауза на знаках препинания
    const lastChunk = words.slice(index, index + step).join(' ');
    if (/[.!?…]$/.test(lastChunk)) delay *= 1.8;
    else if (/[,;:—-]$/.test(lastChunk)) delay *= 1.3;

    timer = setTimeout(() => {
      index += step;
      render();
      if (index < words.length) scheduleNext(); else stop();
    }, delay);
  }

  function play() {
    if (index >= words.length) index = 0;
    playing = true;
    playBtn.textContent = '⏸ Пауза';
    scheduleNext();
  }
  function stop() { playing = false; playBtn.textContent = '▶ Старт'; clearTimeout(timer); }

  playBtn.addEventListener('click', () => playing ? stop() : play());
  resetBtn.addEventListener('click', () => { stop(); index = 0; render(); });
  stage.addEventListener('click', () => playing ? stop() : play());

  // Настройки на лету
  speedSlider.addEventListener('input', () => { 
    speedVal.textContent = speedSlider.value; 
    if (playing) { clearTimeout(timer); scheduleNext(); } 
  });
  wpsSlider.addEventListener('input', () => { 
    wpsVal.textContent = wpsSlider.value; 
    if (playing) { clearTimeout(timer); scheduleNext(); } 
    render(); 
  });
  autoGroup.addEventListener('change', () => { 
    wpsSlider.disabled = autoGroup.checked; 
    if (playing) { clearTimeout(timer); scheduleNext(); } 
    render(); 
  });

  // Горячие клавиши
  document.addEventListener('keydown', e => {
    if (!reader.classList.contains('active')) return;
    if (e.code === 'Space') { e.preventDefault(); playing ? stop() : play(); }
    else if (e.code === 'ArrowRight') { e.preventDefault(); stop(); index = Math.min(index + getStepSize(), Math.max(0, words.length - 1)); render(); }
    else if (e.code === 'ArrowLeft') { e.preventDefault(); stop(); index = Math.max(0, index - getStepSize()); render(); }
    else if (e.code === 'Escape') { backBtn.click(); }
  });
})();
</script>
</body>
</html>
