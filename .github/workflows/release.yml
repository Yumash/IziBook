# Создание GitHub Release по semver-тегу: v1.2.3
# Артефакты: single-file HTML + samples.zip
# Pages не затрагивается — сайт по-прежнему отдаётся из корня main.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle single-file HTML
        run: node scripts/bundle.mjs

      - name: Pack samples
        run: |
          mkdir -p dist
          cd samples
          zip -r ../dist/IziBook-samples.zip .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          HTML="dist/IziBook-v${VERSION}.html"
          if [ ! -f "$HTML" ]; then
            HTML=$(ls dist/IziBook-v*.html | head -n1)
          fi
          gh release create "$TAG" \
            --title "IziBook ${TAG}" \
            --notes "Статическая сборка IziBook ${TAG}. Онлайн: GitHub Pages (index.html в корне main). Вложения: один HTML-файл для офлайн и samples.zip." \
            "$HTML" \
            dist/IziBook-samples.zip
