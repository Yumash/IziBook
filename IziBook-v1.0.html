<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP Reader</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a1a;
    color: #e8e8e8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Экран загрузки ---------- */
  #loader {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 40px;
  }
  #loader h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
  #loader p { color: #999; max-width: 500px; text-align: center; line-height: 1.5; }

  .file-label {
    display: inline-block;
    padding: 14px 28px;
    background: #3a7bd5;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.2s;
  }
  .file-label:hover { background: #4a8be5; }
  input[type="file"] { display: none; }

  #pasteArea {
    width: 100%;
    max-width: 600px;
    height: 150px;
    padding: 12px;
    background: #262626;
    border: 1px solid #333;
    border-radius: 8px;
    color: #e8e8e8;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
  }
  .divider { color: #555; font-size: 13px; }

  /* ---------- Экран чтения ---------- */
  #reader {
    flex: 1;
    display: none;
    flex-direction: column;
    height: 100vh;
  }

  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    position: relative;
    cursor: pointer;
    user-select: none;
    min-height: 0;
  }

  #word {
    font-size: clamp(28px, 6vw, 72px);
    font-weight: 500;
    text-align: center;
    line-height: 1.3;
    letter-spacing: 0.01em;
    transition: opacity 0.05s;
    max-width: 90%;
    white-space: pre-wrap;
  }

  /* Фокусная точка — глаз фиксируется на ней */
  #focusLine {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 2px;
    height: 1.6em;
    background: rgba(255, 80, 80, 0.35);
    pointer-events: none;
  }

  #progressBar {
    height: 3px;
    background: #333;
    position: relative;
  }
  #progressFill {
    height: 100%;
    background: #3a7bd5;
    width: 0%;
    transition: width 0.1s linear;
  }

  #controls {
    padding: 16px 20px;
    background: #222;
    border-top: 1px solid #333;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    justify-content: center;
  }

  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #aaa;
  }
  .ctrl-group label { white-space: nowrap; }
  .ctrl-group input[type="range"] { width: 100px; accent-color: #3a7bd5; }
  .ctrl-group input[type="number"] { width: 60px; }

  .val {
    display: inline-block;
    min-width: 40px;
    text-align: center;
    color: #e8e8e8;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }

  button {
    padding: 10px 20px;
    background: #3a7bd5;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #4a8be5; }
  button.secondary { background: #444; }
  button.secondary:hover { background: #555; }

  #wordCounter {
    position: absolute;
    bottom: 12px;
    right: 20px;
    font-size: 12px;
    color: #666;
    font-variant-numeric: tabular-nums;
  }

  #hint {
    position: absolute;
    bottom: 12px;
    left: 20px;
    font-size: 12px;
    color: #666;
  }

  @media (max-width: 600px) {
    #controls { padding: 10px; gap: 10px; }
    .ctrl-group input[type="range"] { width: 70px; }
    #stage { padding: 16px; }
  }
</style>
</head>
<body>

<!-- ============ ЗАГРУЗКА ============ -->
<div id="loader">
  <h1>📖 RSVP Reader</h1>
  <p>Загрузите книгу (TXT, EPUB не поддерживается — используйте TXT или вставьте текст) или вставьте текст ниже. Читайте слово за словом без движения глаз.</p>

  <label class="file-label">
    📁 Выбрать файл .txt
    <input type="file" id="fileInput" accept=".txt,text/plain">
  </label>

  <span class="divider">— или —</span>

  <textarea id="pasteArea" placeholder="Вставьте текст сюда..."></textarea>
  <button id="startBtn">Начать чтение →</button>
</div>

<!-- ============ ЧТЕНИЕ ============ -->
<div id="reader">
  <div id="stage">
    <div id="focusLine"></div>
    <div id="word">Готовы?</div>
    <div id="hint">Пробел — пауза · ← → — назад/вперёд · Esc — выход</div>
    <div id="wordCounter">0 / 0</div>
  </div>
  <div id="progressBar"><div id="progressFill"></div></div>
  <div id="controls">
    <button id="playBtn">▶ Старт</button>
    <button id="resetBtn" class="secondary">⟲ Сброс</button>

    <div class="ctrl-group">
      <label>Слов за раз:</label>
      <input type="range" id="wordsPerStep" min="1" max="20" value="1">
      <span class="val" id="wordsPerStepVal">1</span>
    </div>

    <div class="ctrl-group">
      <label>Скорость (слов/мин):</label>
      <input type="range" id="speed" min="100" max="1200" step="25" value="300">
      <span class="val" id="speedVal">300</span>
    </div>

    <div class="ctrl-group">
      <label>Авто-группировка:</label>
      <input type="checkbox" id="autoGroup" title="1–3 слова в зависимости от длины">
    </div>
  </div>
</div>

<script>
(() => {
  // ---------- Состояние ----------
  let words = [];          // массив слов
  let index = 0;           // текущий индекс (начало шага)
  let playing = false;
  let timer = null;
  let lastTime = 0;

  // ---------- DOM ----------
  const loader      = document.getElementById('loader');
  const reader      = document.getElementById('reader');
  const wordEl      = document.getElementById('word');
  const stage       = document.getElementById('stage');
  const progressFill= document.getElementById('progressFill');
  const wordCounter = document.getElementById('wordCounter');
  const fileInput   = document.getElementById('fileInput');
  const pasteArea   = document.getElementById('pasteArea');
  const startBtn    = document.getElementById('startBtn');
  const playBtn     = document.getElementById('playBtn');
  const resetBtn    = document.getElementById('resetBtn');
  const speedSlider = document.getElementById('speed');
  const speedVal    = document.getElementById('speedVal');
  const wpsSlider   = document.getElementById('wordsPerStep');
  const wpsVal      = document.getElementById('wordsPerStepVal');
  const autoGroup   = document.getElementById('autoGroup');

  // ---------- Загрузка файла ----------
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      pasteArea.value = ev.target.result;
      startReading(ev.target.result);
    };
    r.readAsText(file, 'UTF-8');
  });

  startBtn.addEventListener('click', () => {
    const text = pasteArea.value.trim();
    if (!text) { alert('Вставьте текст или выберите файл'); return; }
    startReading(text);
  });

  // ---------- Парсинг текста в слова ----------
  function startReading(text) {
    // Нормализация пробелов, разбиение по словам.
    // Сохраняем знаки препинания внутри слова, но отделяем длинные тире.
    words = text
      .replace(/\r/g, '')
      .replace(/[ \t]+/g, ' ')
      .replace(/\n{3,}/g, '\n\n')
      .split(/\s+/)
      .filter(w => w.length > 0);

    if (words.length === 0) { alert('Не удалось найти слова'); return; }

    index = 0;
    loader.style.display = 'none';
    reader.style.display = 'flex';
    render();
  }

  // ---------- Определение размера шага ----------
  function getStepSize() {
    if (autoGroup.checked) {
      // Авто-группировка: 1 слово если длинное, иначе до 3
      const w = words[index] || '';
      const avgLen = w.replace(/[^\p{L}\p{N}]/gu, '').length;
      if (avgLen > 9) return 1;
      if (avgLen > 6) return 2;
      return 3;
    }
    return parseInt(wpsSlider.value, 10);
  }

  // ---------- Отрисовка текущего шага ----------
  function render() {
    if (index >= words.length) {
      wordEl.textContent = '✓ Конец';
      progressFill.style.width = '100%';
      wordCounter.textContent = `${words.length} / ${words.length}`;
      stop();
      return;
    }

    const step = getStepSize();
    const chunk = words.slice(index, index + step).join(' ');
    wordEl.textContent = chunk;

    const done = Math.min(index + step, words.length);
    wordCounter.textContent = `${done} / ${words.length}`;
    progressFill.style.width = (done / words.length * 100) + '%';
  }

  // ---------- Планировщик ----------
  function scheduleNext() {
    if (!playing) return;

    const step = getStepSize();
    const spm = parseInt(speedSlider.value, 10); // слов в минуту
    // Время на шаг: (step / spm) минут
    let delay = (step / spm) * 60000;

    // Небольшая пауза на знаках препинания в конце чанка
    const lastChunk = words.slice(index, index + step).join(' ');
    if (/[.!?…]$/.test(lastChunk)) delay *= 1.8;
    else if (/[,;:—-]$/.test(lastChunk)) delay *= 1.3;

    timer = setTimeout(() => {
      index += step;
      render();
      if (index < words.length) {
        scheduleNext();
      } else {
        stop();
      }
    }, delay);
  }

  function play() {
    if (index >= words.length) index = 0; // рестарт с начала
    playing = true;
    playBtn.textContent = '⏸ Пауза';
    scheduleNext();
  }

  function stop() {
    playing = false;
    playBtn.textContent = '▶ Старт';
    clearTimeout(timer);
  }

  // ---------- Управление ----------
  playBtn.addEventListener('click', () => {
    if (playing) stop();
    else play();
  });

  resetBtn.addEventListener('click', () => {
    stop();
    index = 0;
    render();
  });

  // Пробел — пауза/плей
  document.addEventListener('keydown', e => {
    if (reader.style.display === 'none') return;
    if (e.code === 'Space') {
      e.preventDefault();
      playing ? stop() : play();
    } else if (e.code === 'ArrowRight') {
      e.preventDefault();
      stop();
      index = Math.min(index + getStepSize(), words.length - 1);
      render();
    } else if (e.code === 'ArrowLeft') {
      e.preventDefault();
      stop();
      index = Math.max(0, index - getStepSize());
      render();
    } else if (e.code === 'Escape') {
      stop();
      reader.style.display = 'none';
      loader.style.display = 'flex';
    }
  });

  // Клик по сцене — пауза/плей
  stage.addEventListener('click', () => {
    playing ? stop() : play();
  });

  // ---------- Настройки ----------
  speedSlider.addEventListener('input', () => {
    speedVal.textContent = speedSlider.value;
    // Если играет — перезапускаем таймер с новой скоростью
    if (playing) { clearTimeout(timer); scheduleNext(); }
  });

  wpsSlider.addEventListener('input', () => {
    wpsVal.textContent = wpsSlider.value;
    if (playing) { clearTimeout(timer); scheduleNext(); }
    render();
  });

  autoGroup.addEventListener('change', () => {
    wpsSlider.disabled = autoGroup.checked;
    if (playing) { clearTimeout(timer); scheduleNext(); }
    render();
  });
})();
</script>
</body>
</html>
